<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 工程开标数据智能分析平台 V6.0</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="开标数据 V6">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="stylesheet" href="/static/css/register.css">
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1>🏗️ 工程开标数据智能分析平台</h1>
            <span class="version">V6.0</span>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="username">用户名 <span style="color:#e74c3c;">*</span></label>
                <input type="text" id="username" name="username" required placeholder="3-20 位字母或数字" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+">
                <div class="hint">3-20 位字母、数字或下划线</div>
                <div class="error-text" id="usernameError"></div>
            </div>
            
            <div class="form-group">
                <label for="password">密码 <span style="color:#e74c3c;">*</span></label>
                <input type="password" id="password" name="password" required placeholder="至少 8 位，含字母/数字/特殊字符" minlength="8">
                <div class="hint">建议包含大小写字母、数字和特殊字符 (如 @#$!)</div>
                <div class="error-text" id="passwordError"></div>
                
                <!-- 密码强度指示器 -->
                <div class="strength-meter">
                    <div class="bar" id="bar1"></div>
                    <div class="bar" id="bar2"></div>
                    <div class="bar" id="bar3"></div>
                    <div class="bar" id="bar4"></div>
                </div>
                <div class="label" id="strengthLabel" style="display:none;"></div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">确认密码 <span style="color:#e74c3c;">*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="再次输入密码" minlength="6">
                <div class="error-text" id="confirmPasswordError"></div>
            </div>
            
            <div class="form-group">
                <label for="phone">手机号码 <span style="color:#e74c3c;">*</span></label>
                <input type="tel" id="phone" name="phone" required placeholder="11 位手机号码" pattern="1[3-9][0-9]{9}" maxlength="11">
                <div class="hint">格式：13812345678</div>
                <div class="error-text" id="phoneError"></div>
            </div>
            
            <div class="form-group">
                <label for="email">邮箱地址 <span style="color:#e74c3c;">*</span></label>
                <input type="email" id="email" name="email" required placeholder="example@email.com">
                <div class="hint">用于接收重要通知</div>
                <div class="error-text" id="emailError"></div>
            </div>
            
            <button type="submit" class="btn btn-primary" id="registerBtn">立即注册</button>
            
            <button type="button" class="btn btn-secondary" onclick="window.location.href='/'">返回登录</button>
        </form>
        
        <div class="login-link">
            已有账号？<a href="/">立即登录</a>
        </div>
    </div>

    <script src="/static/js/pages/register.js"></script>
</body>
</html>
