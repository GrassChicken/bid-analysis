<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="开标数据 V6">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <!-- PWA 安装按钮样式 -->
    <style>
    #install-pwa-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        display: none; /* JS 控制显示 */
        align-items: center;
        gap: 6px;
        padding: 12px 18px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        border: none;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        transition: all 0.25s ease;
        z-index: 9999;
    }
    #install-pwa-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(102, 126, 234, 0.5);
    }
    #install-pwa-btn:active {
        transform: translateY(0);
    }
    .pwa-install-icon {
        font-size: 18px;
    }
    .pwa-install-text {
        white-space: nowrap;
    }
    /* 手机端适配 */
    @media (max-width: 768px) {
        #install-pwa-btn {
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 13px;
        }
        .pwa-install-icon {
            font-size: 16px;
        }
    }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>{% block title %}工程开标数据智能分析平台 V6.0{% endblock %}</title>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{% block page_title %}工程开标数据智能分析平台 <span class="version">V6.0</span>{% endblock %}</h1>
            <div class="header-actions">
                {% block header_actions %}{% endblock %}
            </div>
        </div>
        {% block content %}{% endblock %}
    </div>

    <!-- 通用模态框 -->
    <div id="confirmModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <span class="modal-icon" id="modalIcon">ℹ️</span>
                <span class="modal-title" id="modalTitle">确认操作</span>
            </div>
            <div class="modal-body" id="modalContent">确认执行此操作？</div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCancelBtn" onclick="hideModal()">取消</button>
                <button class="btn btn-primary" id="modalConfirmBtn" onclick="hideModal()">确定</button>
            </div>
        </div>
    </div>

    <!-- PWA 安装浮动按钮 -->
    <button id="install-pwa-btn" class="pwa-install-float" title="添加到主屏幕">
        <span class="pwa-install-icon">📲</span>
        <span class="pwa-install-text">安装App</span>
    </button>

    <script src="/static/js/pwa.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
